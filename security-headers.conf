# Included by every location in nginx.conf (add_header in a location drops the ones set above it).
# __API_ORIGIN__ is replaced with VITE_API_URL at image build time (see Dockerfile).
#
# script-src/style-src allow 'unsafe-inline' on purpose: theme previews are sandboxed srcDoc iframes
# holding store-owner code with inline <script>/<style>, and srcDoc frames inherit this policy.
# The sandbox attribute (not the CSP) is what keeps that code off this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' __API_ORIGIN__; frame-src 'self' __API_ORIGIN__ https://www.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self' https://tss-backend-k6zs.onrender.com; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
