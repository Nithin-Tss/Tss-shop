# Static SPA server (TLS is terminated by the load balancer / proxy in front of this container).
server_tokens off;

# Slowloris / oversized request protection
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          20s;
client_max_body_size  1k;            # static site: nothing is ever uploaded here
large_client_header_buffers 4 8k;

server {
  listen 80;
  server_name _;
  keepalive_timeout 15s;
  root /usr/share/nginx/html;
  index index.html;

  # A static site only needs GET/HEAD
  if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Never serve dotfiles, source maps or config leftovers
  location ~ /\.(?!well-known/) { return 404; }
  location ~* \.(?:map|env|bak|old|orig|sql|log|conf|ini|yml|yaml|swp)$ { return 404; }

  # Hashed build output: cache for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri =404;
  }

  # Health check for the platform (no headers/logging noise)
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # SPA fallback (mirrors vercel.json)
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri /index.html;
  }
}
