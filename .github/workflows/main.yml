name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        if: hashFiles('backend/**/*.py') != ''
        run: pip install ruff black

      - name: Lint with Ruff
        if: hashFiles('backend/**/*.py') != ''
        run: ruff check .

      - name: Check formatting with Black
        if: hashFiles('backend/**/*.py') != ''
        run: black --check .

  security:
    name: Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        if: hashFiles('backend/**/*.py') != ''
        run: pip install bandit pip-audit

      - name: Scan code with Bandit
        if: hashFiles('backend/**/*.py') != ''
        run: bandit -r . -x ./.venv -ll

      - name: Audit dependencies for known vulnerabilities
        if: hashFiles('backend/requirements/base.txt') != ''
        run: pip-audit -r requirements/base.txt

      - name: Install production dependencies
        if: hashFiles('backend/config/settings/prod.py') != ''
        run: pip install -r requirements/prod.txt

      - name: Django deployment security checks
        if: hashFiles('backend/config/settings/prod.py') != ''
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-only-deploy-check-key-not-used-anywhere-real-0123456789abcdef
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/unused
          REDIS_URL: redis://localhost:6379/0
          ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/platform_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      SECRET_KEY: ci-only-test-secret
      DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: hashFiles('backend/requirements/dev.txt') != ''
        run: pip install -r requirements/dev.txt

      - name: Django system checks
        if: hashFiles('backend/manage.py') != ''
        run: python manage.py check

      - name: Check for missing migrations
        if: hashFiles('backend/manage.py') != ''
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to a clean database
        if: hashFiles('backend/manage.py') != ''
        run: python manage.py migrate --noinput

      - name: Tenant isolation and security tests
        if: hashFiles('backend/tests/security/**/*.py') != ''
        run: pytest tests/security

      - name: Unit and integration tests
        if: hashFiles('backend/manage.py') != '' && hashFiles('backend/**/test_*.py', 'backend/**/tests.py') != ''
        run: pytest --ignore=tests/security --cov=apps --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always() && hashFiles('backend/coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  assets:
    name: Frontend assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Tailwind dependencies
        if: hashFiles('backend/package-lock.json') != ''
        run: npm ci

      - name: Build Tailwind CSS
        if: hashFiles('backend/package-lock.json') != ''
        run: npm run build:css --if-present

  docker:
    name: Docker build
    needs: [quality, security, test, assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        if: hashFiles('backend/Dockerfile') != ''
        run: docker build -t platform:ci backend

      - name: Scan image for vulnerabilities
        if: hashFiles('backend/Dockerfile') != ''
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:latest image --exit-code 1 --severity CRITICAL,HIGH
          --ignore-unfixed platform:ci
