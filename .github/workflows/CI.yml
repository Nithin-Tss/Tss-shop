name: Frontend CI

on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # same major as Vercel
          cache: npm

      # `npm ci` installs exactly what package-lock.json says and fails if
      # package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Placeholder: only proves the build works. Real value is set in Vercel.
          VITE_API_URL: https://api.example.test

      - name: Check the build output exists
        run: test -s dist/index.html && ls -lh dist/assets | head -20

  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Reports known vulnerabilities in production dependencies without
      # failing the run: `xlsx` currently has an advisory with no fix.
      - name: npm audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
